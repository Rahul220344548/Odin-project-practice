<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .wrapper{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,100px);
            gap: 1em 20px;
        }
        .wrapper > .box{
            border: 1px solid red;
        }
        
        .box1{
            /* grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 4; */
            grid-column: 1/2;
            grid-row: 1/4;
        }
        .box2{
            grid-column: 3/4;
            grid-row: 1/3;
        }
        .box4{
            grid-column: 2/4;
            grid-row: 3;
        }

    </style>
</head>
<body>

    <div class="wrapper">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
        <div class="box box4">box4</div>

    </div>


    
</body>
</html>
